<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Project Submission Tool — Apply for authorization</title>

<!-- ============ REAL GC Design System (GCDS) web components ============ -->
<link rel="stylesheet" href="https://cdn.design-system.alpha.canada.ca/@cdssnc/gcds-components@0.47.0/dist/gcds/gcds.css">
<script type="module" src="https://cdn.design-system.alpha.canada.ca/@cdssnc/gcds-components@0.47.0/dist/gcds/gcds.esm.js"></script>
<script nomodule src="https://cdn.design-system.alpha.canada.ca/@cdssnc/gcds-components@0.47.0/dist/gcds/gcds.js"></script>

<style>
@import url('https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&family=Noto+Sans:ital,wght@0,400;0,600;0,700;1,400&display=swap');

:root{
  --brand-blue:#26374A; --blue-700:#2B4380;
  --flag-red:#EB2D37; --accent-red:#A62A1E;
  --link:#284162; --link-hover:#0535D2; --link-visited:#7834BC;
  --grey-5:#F1F2F3; --grey-20:#D6D9DD; --grey-30:#A8ADB4; --grey-50:#7D828B;
  --grey-70:#545961; --grey-80:#43474E; --text:#333; --danger:var(--gcds-error-message-text,#d3080c);
  --success:#278400; --focus:#0535D2;
  --font-h:'Lato','Helvetica Neue',Arial,sans-serif;
  --font-b:'Noto Sans','Helvetica Neue',Arial,sans-serif;
  --content:1140px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{font-family:var(--font-b);color:var(--text);font-size:20px;line-height:32px;background:#fff;-webkit-font-smoothing:antialiased;}
h1,h2,h3,h4{font-family:var(--font-h);font-weight:700;color:var(--text);margin:0;}
a{color:var(--link);text-decoration:underline;text-underline-offset:.15em;}
a:hover{color:var(--link-hover);}
a:visited{color:var(--link-visited);}
:focus-visible{outline:3px solid var(--focus);outline-offset:1px;}
.page{min-height:100vh;display:flex;flex-direction:column;}
.container{width:100%;max-width:var(--content);margin:0 auto;padding:0 24px;}
.grow{flex:1;}
.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;}
[hidden]{display:none!important;}

/* ---------- Page head ---------- */
main{max-width:780px;}
.gc-stepper{font-size:20px;color:var(--text);margin:24px 0 4px;}
.gc-pagetitle{position:relative;font-size:41px;line-height:48px;padding-bottom:.2em;margin:0 0 28px;}
.gc-pagetitle::after{content:"";position:absolute;left:0;bottom:0;width:72px;height:6px;background:var(--accent-red);}
.gc-intro{max-width:65ch;margin:0 0 32px;font-size:20px;}
.field-block{margin-bottom:36px;}

/* ---------- Character counter (custom component, as authored) ---------- */
.input-character-counter p,.textarea-character-counter p{font-size:18px;color:var(--grey-70);margin:8px 0 0;}
.input-character-counter p.counter-limit,.textarea-character-counter p.counter-limit{color:var(--danger);font-weight:700;}

/* ---------- File uploader (custom, per design spec) ---------- */
.file-uploader{margin-top:8px;}
.file-label{font-weight:700;font-size:20px;display:block;}
.file-label .req{font-weight:400;color:var(--grey-70);}
.file-hint{font-size:18px;color:var(--grey-70);margin:4px 0 14px;max-width:65ch;}
.upload-loader{display:flex;align-items:center;gap:12px;margin:16px 0;font-size:18px;}
.spinner{flex:none;width:31px;height:31px;border:4px solid var(--grey-20);border-top-color:var(--blue-700);border-radius:50%;animation:spin 2s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
@media (prefers-reduced-motion:reduce){.spinner{animation-duration:6s;}}
.upload-success{display:flex;align-items:center;gap:8px;color:var(--grey-70);font-weight:400;font-size:18px;margin:16px 0 8px;}
.upload-success svg{width:20px;height:20px;flex:none;color:var(--grey-70);}
.file-container{border:1px solid var(--grey-20);border-radius:4px;padding:4px 16px;max-width:560px;margin-top:8px;}
.file-list{list-style:none;margin:0;padding:0;}
.file-list.scrolls{max-height:260px;overflow-y:auto;resize:vertical;}
.file-list.scrolls::-webkit-scrollbar{width:14px;}
.file-list.scrolls::-webkit-scrollbar-thumb{background:var(--grey-50);border-radius:8px;border:3px solid #fff;}
.file-row{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 0;border-bottom:1px solid var(--grey-20);}
.file-row:last-child{border-bottom:none;}
.file-row__name{display:flex;align-items:center;gap:8px;min-width:0;}
.file-row__name .ck{flex:none;color:var(--success);width:20px;height:20px;}
.file-row__name a{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:360px;}
.file-remove{display:inline-flex;align-items:center;gap:6px;min-height:44px;background:none;border:none;color:var(--danger);font-family:var(--font-b);font-size:18px;cursor:pointer;text-decoration:underline;text-underline-offset:.15em;padding:10px 8px;flex:none;}
.file-remove:hover{color:#822117;}
.file-remove svg{width:14px;height:14px;color:var(--flag-red);}
.file-error{color:var(--danger);font-weight:700;font-size:18px;display:flex;align-items:center;gap:6px;margin:10px 0;}
.file-error svg{width:18px;height:18px;flex:none;}
.field--fileerror{border-left:4px solid var(--danger);padding-left:16px;}

/* ---------- Coordinate panels ---------- */
.coord-type{margin-bottom:24px;display:block;}
.coordinate-panel{padding-top:8px;}
.dms-group{border:none;margin:0 0 28px;padding:0;}
.dms-group > legend{font-weight:700;font-size:20px;margin-bottom:2px;padding:0;}
.dms-group .hint{font-size:18px;color:var(--grey-70);margin:0 0 12px;max-width:65ch;}
.dms-error{color:var(--danger);font-weight:700;font-size:18px;display:flex;align-items:center;gap:6px;margin:0 0 12px;}
.dms-error svg{width:18px;height:18px;flex:none;}
.dms-group.has-error gcds-input::part(input){border-color:var(--danger)!important;box-shadow:inset 0 0 0 1px var(--danger);}
.dms-inputs{display:flex;align-items:flex-end;gap:10px;flex-wrap:wrap;}
.dms-sep{font-size:26px;padding-bottom:14px;color:var(--grey-70);}

/* ---------- Checkboxes ---------- */
.activity-selector{border:1px solid var(--grey-30);border-radius:4px;margin:0;padding:24px;}
.activity-selector > legend{float:left;width:100%;font-weight:700;font-size:20px;padding:0;margin:0 0 4px;}
.activity-selector .req{font-weight:400;color:var(--grey-70);}
.activity-hint{clear:both;font-size:18px;color:var(--grey-70);margin:4px 0 20px;}
.activity-category{border:1px solid var(--grey-30);border-radius:4px;padding:24px;margin-bottom:12px;}
.activity-category h3{font-family:var(--font-h);font-weight:700;font-size:20px;margin:0 0 8px;}
.activity-grid{display:grid;grid-template-columns:1fr 1fr;column-gap:51px;}

/* ---------- Error summary + inline (custom, GC pattern) ---------- */
.error-summary{border:2px solid var(--danger);padding:20px 24px 24px;margin:0 0 36px;}
.error-summary h2{font-size:29px;line-height:36px;margin:0 0 12px;}
.error-summary ol{margin:0;padding-left:24px;}
.error-summary li{margin:8px 0;font-size:18px;}
.error-summary a{color:var(--danger);}

/* ---------- Summary cards (step 4) ---------- */
.md-summary-section{margin-bottom:36px;}
.md-summary-card{max-width:744px;border:1px solid var(--grey-20);background:#fff;}
.md-summary-card__header{background:var(--grey-5);padding:16px 20px;border-bottom:1px solid var(--grey-20);}
.md-summary-body{padding:0 20px;}
.md-summary-row{display:grid;grid-template-columns:290px 1fr;gap:0 20px;padding:12px 0;border-top:1px solid var(--grey-20);}
.md-summary-row:first-child{border-top:none;}
.md-summary-row__label{font-weight:700;}
.md-file-list{margin:0;padding-left:22px;}
.md-file-list li{margin:2px 0;}
.md-summary-actions{border-top:1px solid var(--grey-20);padding:12px 20px;}
.md-summary-actions a{display:inline-flex;align-items:center;gap:8px;}
.md-summary-actions svg{width:18px;height:18px;}

.form-actions{display:flex;gap:12px;margin:40px 0 8px;}

/* ---------- Modal ---------- */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center;padding:24px;z-index:200;}
.modal{background:#fff;max-width:520px;width:100%;padding:36px;position:relative;}
.modal h2{font-size:29px;line-height:36px;margin:0 0 16px;padding-right:32px;}
.modal p{font-size:18px;line-height:28px;margin:0 0 16px;}
.modal__close{position:absolute;top:24px;right:24px;background:none;border:none;cursor:pointer;padding:6px;color:var(--text);}
.modal__close svg{width:22px;height:22px;}
.modal__actions{display:flex;gap:12px;margin-top:24px;}

@media (max-width:767px){
  body{font-size:18px;line-height:28px;}
  .gc-pagetitle{font-size:37px;line-height:44px;}
  .activity-grid{grid-template-columns:1fr;column-gap:0;}
  .md-summary-row{grid-template-columns:1fr;gap:0;}
}
</style>
</head>
<body>
<div class="page">
  <div id="a11y-live" class="sr-only" aria-live="assertive" aria-atomic="true"></div>
  <!-- ============ HEADER (real gcds-header) ============ -->
  <gcds-header lang-href="#" skip-to-href="#main-content" signature-has-link="false">
    <gcds-top-nav label="Project Submission Tool" alignment="right" slot="menu">
      <gcds-nav-link href="#" slot="home" data-guard>Project Submission Tool</gcds-nav-link>
      <gcds-nav-link href="#" data-guard>Sign out</gcds-nav-link>
    </gcds-top-nav>
    <gcds-breadcrumbs slot="breadcrumb" hide-canada-link id="breadcrumbs">
      <gcds-breadcrumbs-item href="#" data-guard>Project Submission Tool</gcds-breadcrumbs-item>
      <gcds-breadcrumbs-item href="#" data-guard>Apply for authorization</gcds-breadcrumbs-item>
    </gcds-breadcrumbs>
  </gcds-header>

  <div class="container grow">
    <main id="main-content">
      <section id="step-1" class="step"></section>
      <section id="step-2" class="step" hidden></section>
      <section id="step-3" class="step" hidden></section>
      <section id="step-4" class="step" hidden></section>
    </main>
  </div>

  <!-- ============ FOOTER (real gcds-footer) ============ -->
  <gcds-footer display="compact" contextual-heading="Project Submission Tool" contextual-links='{"Projects near water":"#","About":"#","Contact the Fish and Fish Habitat Protection Program":"#"}'></gcds-footer>
</div>
<div id="modal-mount"></div>
<template id="__bundler_thumbnail">
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="#26374A"/><rect x="30" y="30" width="40" height="40" rx="4" fill="#fff"/><rect x="30" y="30" width="10" height="16" fill="#EB2D37"/><rect x="60" y="30" width="10" height="16" fill="#EB2D37"/></svg>
</template>

<script>
"use strict";
var IC={
 exclamation:'<svg viewBox="0 0 512 512" aria-hidden="true" fill="currentColor"><path d="M504 256c0 137-111 248-248 248S8 393 8 256 119 8 256 8s248 111 248 248zM256 306c-25 0-46 21-46 46s21 46 46 46 46-21 46-46-21-46-46-46zm-44-165l7 136c.4 6 6 11 12 11h49c6 0 12-5 12-11l7-136c.4-7-5-13-12-13h-63c-7 0-12 6-12 13z"/></svg>',
 check:'<svg viewBox="0 0 512 512" aria-hidden="true" fill="currentColor"><path d="M174 439L7 273c-9-9-9-25 0-34l34-34c9-9 25-9 34 0l117 117L433 72c9-9 25-9 34 0l34 34c9 9 9 25 0 34L208 439c-9 9-25 9-34 0z"/></svg>',
 pen:'<svg viewBox="0 0 512 512" aria-hidden="true" fill="currentColor"><path d="M403 83l90 90c4 4 4 10 0 14L274 406l-93 10c-12 1-23-9-21-22l10-93L389 83c4-4 10-4 14 0zm162-23l-49-49c-15-15-40-15-55 0l-35 35c-4 4-4 10 0 14l90 90c4 4 10 4 14 0l35-35c15-15 15-40 0-55zM384 346v102H64V128h230c3 0 6-1 8-4l40-40c8-8 2-20-8-20H48C21 64 0 86 0 112v352c0 26 21 48 48 48h352c26 0 48-22 48-48V306c0-11-13-16-20-8l-40 40c-3 2-4 5-4 8z"/></svg>',
 x:'<svg viewBox="0 0 352 512" aria-hidden="true" fill="currentColor"><path d="M242 256l100-100c12-12 12-31 0-43l-22-22c-12-12-31-12-43 0L177 191 77 91c-12-12-31-12-43 0L12 113c-12 12-12 31 0 43l100 100L12 356c-12 12-12 31 0 43l22 22c12 12 31 12 43 0l100-100 100 100c12 12 31 12 43 0l22-22c12-12 12-31 0-43z"/></svg>'
};
var TITLE_LIMIT=20, PURPOSE_LIMIT=100, MAX_FILES=10;
var ACCEPT=['png','jpeg','jpg','pdf','zip'];
var ACTIVITIES=[
 {group:'Transportation infrastructure',items:['Boat house','Boat launch/ ramp','Bridge','Causeway','Culvert','Dock recreational','Ford','Ice bridge and snow fill','Jetty','Mooring','Pier','Wharf']},
 {group:'Erosion protection and shoreline, bank and channel modification',items:['Beach','Berm','Breakwater','Dyke','Groyne','Shoreline/ streambank stabilization','Watercourse realignment']},
 {group:'Water level and flow modification',items:['Dam','Fishway/ ladder','Groundwater extraction','Stormwater management facility','Surface water taking','Water control structure','Water intake','Water outfall','Weir']},
 {group:'Soil and sediment removal and disposal, waste storage',items:['Blasting','Dredging (in water)','Excavation (on land, near water)','Open water disposal','Tailings impoundment area']},
 {group:'Vegetation removal, beaver dam removal, log handling and habitat modification',items:['Aquatic vegetation removal','Beaver dam removal','Habitat restoration','Log handling/ dump','Log removal','Riparian vegetation removal']},
 {group:'Energy infrastructure, resource extraction and exploration',items:['Aquaculture','Cable crossings','Pipeline crossing','Seismic work','Turbine (hydro and tidal)','Wind power structure']}
];
var STEP_TITLES=['Project overview','Project location','Proposed work','Check your answers before you submit'];
var state={step:1,title:'',files:[],coordType:'dd',activities:{},uploading:false,uploadTimer:null,uploadError:''};

function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function elFrom(html){var t=document.createElement('template');t.innerHTML=html.trim();return t.content.firstChild;}
function gv(id){var e=document.getElementById(id);return e?(e.value==null?'':(''+e.value)):'';}
function announce(m){var l=document.getElementById('a11y-live');if(l){l.textContent='';setTimeout(function(){l.textContent=m;},60);}}
function normNeg(el){ if(!el) return; var v=(el.value||'').replace(/-/g,''); el.value='-'+v; }

/* ============ BREADCRUMBS (3rd crumb = project title) ============ */
function renderBreadcrumbs(){
 var bc=document.getElementById('breadcrumbs'); if(!bc) return;
 var cur=document.getElementById('bc-current');
 if(state.step>1){
  if(!cur){ cur=document.createElement('gcds-breadcrumbs-item'); cur.id='bc-current'; cur.setAttribute('href','#'); cur.setAttribute('data-guard',''); bc.appendChild(cur); }
  cur.textContent=state.title?state.title:'[Project title]';
 } else if(cur){ cur.remove(); }
}

/* ============ NAV GUARD (block leaving during upload) ============ */
document.addEventListener('click',function(e){
 var a=e.target.closest('[data-guard]');if(!a)return;e.preventDefault();
 if(state.uploading) openModal(function(){});
});

/* ============ STEP NAV ============ */
function showStep(n){
 state.step=n;
 for(var i=1;i<=4;i++){document.getElementById('step-'+i).hidden=(i!==n);}
 if(n===4) buildStep4();
 renderBreadcrumbs();
 window.scrollTo(0,0);
 var h1=document.getElementById('h1-'+n); if(h1) h1.focus();
}
function pageHeadHtml(n){
 return '<p class="gc-stepper">Step '+n+' of 4</p><h1 class="gc-pagetitle" id="h1-'+n+'" tabindex="-1">'+esc(STEP_TITLES[n-1])+'</h1>';
}

/* ============ CHARACTER COUNTER ============ */
function updateCounter(node,limit,len){
 var r=Math.max(0,limit-len);
 node.textContent='You have '+r+' character'+(r===1?'':'s')+' remaining.';
 node.classList.toggle('counter-limit',r===0);
 var live=document.getElementById('counter-live');
 if(live){
  if(r===0){ live.textContent=''; setTimeout(function(){live.textContent='You have 0 characters remaining.';},60); }
  else { live.textContent=''; }
 }
}

/* ============================================================ STEP 1 ============================================================ */
function buildStep1(){
 var s=document.getElementById('step-1');
 s.innerHTML=pageHeadHtml(1)+
  '<div id="err-1"></div>'+
  '<div id="counter-live" class="sr-only" aria-live="assertive"></div>'+
  '<div class="field-block"><div class="input-character-counter">'+
    '<gcds-input id="f-title" input-id="f-title" name="projectTitle" label="Project title" hint="Give your project a unique title to identify it" required maxlength="'+TITLE_LIMIT+'" validate-on="other"></gcds-input>'+
    '<p id="c-title" aria-live="polite" aria-atomic="true">You have '+TITLE_LIMIT+' characters remaining.</p>'+
  '</div></div>'+
  '<div class="field-block"><div class="textarea-character-counter">'+
    '<gcds-textarea id="f-purpose" textarea-id="f-purpose" name="projectPurpose" label="Describe the purpose of the project" rows="6" required maxlength="'+PURPOSE_LIMIT+'" hide-limit validate-on="other"></gcds-textarea>'+
    '<p id="c-purpose" aria-live="polite" aria-atomic="true">You have '+PURPOSE_LIMIT+' characters remaining.</p>'+
  '</div></div>'+
  '<div class="field-block" id="uploader-block"></div>'+
  '<div class="form-actions"><gcds-button id="next-1" type="button" button-role="primary">Next</gcds-button></div>';

 var tEl=document.getElementById('f-title'),tC=document.getElementById('c-title');
 tEl.addEventListener('gcdsInput',function(e){var v=(e.detail!=null?e.detail:tEl.value)||'';if(v.length>TITLE_LIMIT){v=v.slice(0,TITLE_LIMIT);tEl.value=v;}state.title=v;updateCounter(tC,TITLE_LIMIT,v.length);renderBreadcrumbs();});
 var pEl=document.getElementById('f-purpose'),pC=document.getElementById('c-purpose');
 pEl.addEventListener('gcdsInput',function(e){var v=(e.detail!=null?e.detail:pEl.value)||'';if(v.length>PURPOSE_LIMIT){v=v.slice(0,PURPOSE_LIMIT);pEl.value=v;}updateCounter(pC,PURPOSE_LIMIT,v.length);});

 renderUploader();
 document.getElementById('next-1').addEventListener('click',function(){ if(state.uploading){announce('Your file is uploading, stay on this page until it\u2019s finished.'); return;} submitStep1(); });
}
function submitStep1(){
 var errs=[];
 clearFieldError('f-title'); clearFieldError('f-purpose');
 if(!gv('f-title').trim()){errs.push({id:'f-title',msg:'Project title is a required field, enter a response'});setFieldError('f-title','Project title is a required field, enter a response');}
 if(!gv('f-purpose').trim()){errs.push({id:'f-purpose',msg:'Description of the project is a required field, enter a response'});setFieldError('f-purpose','Description of the project is a required field, enter a response');}
 if(state.files.length===0){errs.push({id:'choose-file',msg:'Photos of the water body or watercourse is a required field, upload a file'});state.uploadError='Photos of the water body or watercourse is a required field, upload a file';renderUploader();}
 finish('err-1',errs,2);
}

/* ---- File uploader ---- */
function renderUploader(){
 var b=document.getElementById('uploader-block'); if(!b) return;
 var html='<span class="file-label" id="l-photos">Upload photos of the water body or watercourse that will be affected by the project <span class="req">(required)</span></span>'+
  '<p class="file-hint" id="h-photos">Upload up to 10 files in PNG, JPEG, PDF or ZIP format. Each file must be smaller than 200 MB.</p>';
 b.className='field-block'+(state.uploadError?' field--fileerror':'');
 if(state.uploadError) html+='<p class="file-error">'+IC.exclamation+'<span>'+esc(state.uploadError)+'</span></p>';
 html+='<div class="file-uploader">'+
   '<input type="file" id="f-file" class="sr-only" accept=".png,.jpeg,.jpg,.pdf,.zip">'+
   '<gcds-button id="choose-file" type="button" button-role="secondary">Choose file</gcds-button>';
 if(state.uploading) html+='<div class="upload-loader"><span class="spinner" aria-hidden="true"></span><span id="loader-text" tabindex="-1" role="status">Your file is uploading, stay on this page until it\u2019s finished.</span></div>';
 if(state.files.length){
  if(!state.uploading){ html+='<p class="upload-success" id="upload-success" tabindex="-1" role="status">'+IC.check+'<span>Your file has finished uploading.</span></p>'; }
  html+='<div class="file-container"><div class="file-list'+(state.files.length>5?' scrolls':'')+'"'+(state.files.length>5?' tabindex="0"':'')+'>';
  state.files.forEach(function(f,i){
   html+='<div class="file-row"><span class="file-row__name">'+
     '<a href="#" title="'+esc(f.name)+'" onclick="return false">'+esc(clampName(f.name))+'<span class="sr-only">, download file</span></a></span>'+
     '<button type="button" class="file-remove" data-i="'+i+'">Remove '+IC.x+'<span class="sr-only"> '+esc(f.name)+'</span></button></div>';
  });
  html+='</div></div>';
 }
 html+='</div>';
 b.innerHTML=html;
 var input=document.getElementById('f-file');
 document.getElementById('choose-file').addEventListener('click',function(){ if(state.uploading){ announce('Your file is uploading, stay on this page until it\u2019s finished.'); return; } input.click(); });
 input.addEventListener('change',function(){ handleFile(this.files[0]); this.value=''; });
 Array.prototype.forEach.call(b.querySelectorAll('.file-remove'),function(btn){
  btn.addEventListener('click',function(){ removeFile(+btn.getAttribute('data-i')); });
 });
}
function handleFile(file){
 if(!file) return;
 state.uploadError='';
 var ext=(file.name.split('.').pop()||'').toLowerCase();
 if(ACCEPT.indexOf(ext)===-1){ state.uploadError='"'+file.name+'" is not an accepted format. Upload PNG, JPEG, PDF or ZIP files only.'; renderUploader(); focusChoose(); return; }
 if(state.files.length>=MAX_FILES){ state.uploadError='You can upload up to 10 files. Remove a file before adding another.'; renderUploader(); focusChoose(); return; }
 state.uploading=true; renderUploader(); focusChoose();
 announce('Your file is uploading, stay on this page until it\u2019s finished.');
 var delay=5000+Math.floor(Math.random()*2000);
 state.uploadTimer=setTimeout(function(){ state.uploading=false; state.files.push({name:file.name}); state.uploadTimer=null; renderUploader(); announce('Your file has finished uploading.'); focusChoose(); },delay);
}
function removeFile(i){ state.files.splice(i,1); renderUploader(); focusChoose(); }
function focusChoose(){ var c=document.getElementById('choose-file'); if(c) c.focus(); }
function clampName(n){ return n.length<=60 ? n : n.slice(0,40)+'\u2026'; }

/* ============================================================ STEP 2 ============================================================ */
function buildStep2(){
 var s=document.getElementById('step-2');
 var typeOpts=JSON.stringify([
  {id:'ct-dd',label:'Degrees, Decimal',value:'dd',checked:true},
  {id:'ct-dms',label:'Degrees, Minutes, Seconds',value:'dms'},
  {id:'ct-utm',label:'UTM',value:'utm'}
 ]);
 s.innerHTML=pageHeadHtml(2)+
  '<p class="gc-intro">Tell us where the project will take place by providing geographic coordinates.</p>'+
  '<div id="err-2"></div>'+
  '<gcds-radios class="coord-type" name="coordinateType" legend="Coordinate type" hint="" required options=\''+typeOpts+'\'></gcds-radios>'+
  '<div class="coordinate-panel" id="panel-dd">'+
    '<gcds-input id="f-dd-lat" class="field-block" input-id="f-dd-lat" name="ddLat" label="Latitude" hint="Enter latitude in degrees, decimals. Use at least 4 decimal places. For example, 45.4215." required size="10" validate-on="other"></gcds-input>'+
    '<gcds-input id="f-dd-lon" class="field-block" input-id="f-dd-lon" name="ddLon" label="Longitude" hint="Enter longitude in degrees, decimals. Use at least 4 decimal places. For example, -45.4215." required size="10" value="-" validate-on="other"></gcds-input>'+
  '</div>'+
  '<div class="coordinate-panel" id="panel-dms" hidden>'+
    dmsGroupHtml('lat','Latitude','Enter latitude in degrees, minutes, and seconds. For example: 62\u00b0 25\u2032 17\u2033 N')+
    dmsGroupHtml('lon','Longitude','Enter longitude in degrees, minutes, and seconds. For example: 62\u00b0 25\u2032 17\u2033 W')+
  '</div>'+
  '<div class="coordinate-panel" id="panel-utm" hidden>'+
    '<gcds-input id="f-utm-zone" class="field-block" input-id="f-utm-zone" name="utmZone" label="UTM zone" required size="2" validate-on="other"></gcds-input>'+
    '<gcds-input id="f-utm-easting" class="field-block" input-id="f-utm-easting" name="utmEasting" label="Easting" hint="Enter Easting in metres. For example, 704260 m." required size="6" validate-on="other"></gcds-input>'+
    '<gcds-input id="f-utm-northing" class="field-block" input-id="f-utm-northing" name="utmNorthing" label="Northing" hint="Enter Northing in metres. For example, 5903230 m." required size="7" validate-on="other"></gcds-input>'+
  '</div>'+
  '<div class="form-actions"><gcds-button id="back-2" type="button" button-role="secondary">Back</gcds-button><gcds-button id="next-2" type="button" button-role="primary">Next</gcds-button></div>';

 var radios=s.querySelector('gcds-radios');
 radios.addEventListener('gcdsChange',function(e){ state.coordType=(e.detail!=null?e.detail:radios.value)||state.coordType; swapPanels(); });
 radios.addEventListener('change',function(){ if(radios.value){state.coordType=radios.value;swapPanels();} });
 setupPaste(['f-dd-lat','f-dd-lon']);
 setupPaste(['f-dms-latD','f-dms-latM','f-dms-latS','f-dms-lonD','f-dms-lonM','f-dms-lonS']);
 setupPaste(['f-utm-zone','f-utm-easting','f-utm-northing']);
 var lonEl=document.getElementById('f-dd-lon'); if(lonEl) lonEl.addEventListener('gcdsInput',function(){ normNeg(lonEl); });
 document.getElementById('back-2').addEventListener('click',function(){showStep(1);});
 document.getElementById('next-2').addEventListener('click',submitStep2);
 swapPanels();
}
function dmsGroupHtml(key,label,hint){
 return '<fieldset class="dms-group" id="dms-fs-'+key+'"><legend>'+label+' <span style="font-weight:400;color:var(--grey-70)">(required)</span></legend>'+
  '<p class="hint">'+hint+'</p>'+
  '<p class="dms-error" id="dmserr-'+key+'" hidden>'+IC.exclamation+'<span></span></p>'+
  '<div class="dms-inputs">'+
   '<gcds-input id="f-dms-'+key+'D" input-id="f-dms-'+key+'D" name="'+key+'Deg" label="Degrees" size="2" inputmode="numeric" validate-on="other"></gcds-input><span class="dms-sep" aria-hidden="true">\u00b0</span>'+
   '<gcds-input id="f-dms-'+key+'M" input-id="f-dms-'+key+'M" name="'+key+'Min" label="Minutes" size="2" inputmode="numeric" validate-on="other"></gcds-input><span class="dms-sep" aria-hidden="true">\u2032</span>'+
   '<gcds-input id="f-dms-'+key+'S" input-id="f-dms-'+key+'S" name="'+key+'Sec" label="Seconds" size="2" inputmode="numeric" validate-on="other"></gcds-input><span class="dms-sep" aria-hidden="true">\u2033</span>'+
  '</div></fieldset>';
}
function swapPanels(){ ['dd','dms','utm'].forEach(function(t){var p=document.getElementById('panel-'+t);if(p)p.hidden=(state.coordType!==t);}); }
function setupPaste(ids){
 ids.forEach(function(id){
  var wait=setInterval(function(){
   var el=document.getElementById(id); if(!el) return; clearInterval(wait);
   el.addEventListener('paste',function(e){
    var text=(e.clipboardData||window.clipboardData).getData('text');
    var nums=text.match(/-?\d+(?:\.\d+)?/g);
    if(nums&&nums.length>1){
     e.preventDefault();
     ids.forEach(function(fid,i){var f=document.getElementById(fid);if(f&&nums[i]!=null){f.value=nums[i];}});
     var lonF=document.getElementById('f-dd-lon'); if(lonF&&ids.indexOf('f-dd-lon')>-1) normNeg(lonF);
     var last=document.getElementById(ids[Math.min(nums.length,ids.length)-1]); if(last&&last.focus)last.focus();
    }
   });
  },200);
 });
}
function submitStep2(){
 var errs=[];
 ['f-dd-lat','f-dd-lon','f-utm-zone','f-utm-easting','f-utm-northing'].forEach(clearFieldError);
 clearDmsError('lat'); clearDmsError('lon');
 if(state.coordType==='dd'){
  if(!gv('f-dd-lat').trim()) pushErr(errs,'f-dd-lat','Latitude is a required field, enter a response');
  var lon=gv('f-dd-lon').trim(); if(!lon||lon==='-') pushErr(errs,'f-dd-lon','Longitude is a required field, enter a response');
 }else if(state.coordType==='dms'){
  if(!(gv('f-dms-latD')&&gv('f-dms-latM')&&gv('f-dms-latS'))){errs.push({id:'f-dms-latD',msg:'Latitude is a required field, enter a response'});setDmsError('lat','Latitude is a required field, enter a response');}
  if(!(gv('f-dms-lonD')&&gv('f-dms-lonM')&&gv('f-dms-lonS'))){errs.push({id:'f-dms-lonD',msg:'Longitude is a required field, enter a response'});setDmsError('lon','Longitude is a required field, enter a response');}
 }else{
  if(!gv('f-utm-zone').trim()) pushErr(errs,'f-utm-zone','UTM zone is a required field, enter a response');
  if(!gv('f-utm-easting').trim()) pushErr(errs,'f-utm-easting','Easting is a required field, enter a response');
  if(!gv('f-utm-northing').trim()) pushErr(errs,'f-utm-northing','Northing is a required field, enter a response');
 }
 finish('err-2',errs,3);
}
function pushErr(errs,id,msg){ errs.push({id:id,msg:msg}); setFieldError(id,msg); }
function setDmsError(key,msg){var fs=document.getElementById('dms-fs-'+key);var p=document.getElementById('dmserr-'+key);if(fs)fs.classList.add('has-error');if(p){p.hidden=false;p.querySelector('span').textContent=msg;}}
function clearDmsError(key){var fs=document.getElementById('dms-fs-'+key);var p=document.getElementById('dmserr-'+key);if(fs)fs.classList.remove('has-error');if(p)p.hidden=true;}

/* ============================================================ STEP 3 ============================================================ */
function buildStep3(){
 var s=document.getElementById('step-3');
 var html=pageHeadHtml(3)+'<div id="err-3"></div>'+
  '<fieldset class="activity-selector"><legend>Select the work or activity included in your project <span class="req">(required)</span></legend>'+
  '<p class="activity-hint">Select all that apply</p><div id="activity-err"></div>';
 ACTIVITIES.forEach(function(cat,ci){
  html+='<div class="activity-category"><h3>'+esc(cat.group)+'</h3><div class="activity-grid">';
  cat.items.forEach(function(item,ii){
   var opt=JSON.stringify([{id:'cb-'+ci+'-'+ii,label:item,value:item}]);
   html+='<gcds-checkboxes name="activity-'+ci+'-'+ii+'" options=\''+opt.replace(/'/g,"&#39;")+'\'></gcds-checkboxes>';
  });
  html+='</div></div>';
 });
 html+='</fieldset><div class="form-actions"><gcds-button id="back-3" type="button" button-role="secondary">Back</gcds-button><gcds-button id="next-3" type="button" button-role="primary">Next</gcds-button></div>';
 s.innerHTML=html;
 Array.prototype.forEach.call(s.querySelectorAll('gcds-checkboxes'),function(cb){
  cb.addEventListener('gcdsChange',function(){
   var vals=cb.value, on=Array.isArray(vals)?vals.length>0:!!vals;
   var label=(JSON.parse(cb.getAttribute('options'))[0]).label;
   if(on) state.activities[label]=true; else delete state.activities[label];
  });
 });
 document.getElementById('back-3').addEventListener('click',function(){showStep(2);});
 document.getElementById('next-3').addEventListener('click',submitStep3);
}
function submitStep3(){
 var errs=[]; var box=document.getElementById('activity-err'); box.innerHTML='';
 if(Object.keys(state.activities).length===0){
  errs.push({id:'activity-first',msg:'Select the work or activity is a required field, select a response'});
  box.innerHTML='<p class="file-error">'+IC.exclamation+'<span>Select the work or activity is a required field, select a response</span></p>';
 }
 finish('err-3',errs,4);
}

/* ============================================================ STEP 4 ============================================================ */
function buildStep4(){
 var s=document.getElementById('step-4');
 var files=state.files.length?'<ul class="md-file-list">'+state.files.map(function(f){return '<li><a href="#" onclick="return false">'+esc(clampName(f.name))+'</a></li>';}).join('')+'</ul>':'None';
 var ov=[['Project title',esc(gv('f-title')||'None')],['Project purpose',esc(gv('f-purpose')||'None')]];
 var loc=[];
 if(state.coordType==='dd'){loc.push(['Latitude',esc(gv('f-dd-lat')||'None')]);loc.push(['Longitude',esc(gv('f-dd-lon')&&gv('f-dd-lon')!=='-'?gv('f-dd-lon'):'None')]);}
 else if(state.coordType==='dms'){loc.push(['Latitude',dmsStr('lat')]);loc.push(['Longitude',dmsStr('lon')]);}
 else{loc.push(['UTM zone',esc(gv('f-utm-zone')||'None')]);loc.push(['Easting',gv('f-utm-easting')?esc(gv('f-utm-easting'))+' m':'None']);loc.push(['Northing',gv('f-utm-northing')?esc(gv('f-utm-northing'))+' m':'None']);}
 var acts=Object.keys(state.activities);
 var work=acts.length?'<ul class="md-file-list">'+acts.map(function(a){return '<li>'+esc(a)+'</li>';}).join('')+'</ul>':'None';
 s.innerHTML=pageHeadHtml(4)+
  card('Project overview',ov.concat([['Water body or watercourse photos',files]]),'Edit project overview',1)+
  card('Project location',loc,'Edit project location',2)+
  card('Proposed work',[['Work and activity',work]],'Edit proposed work',3)+
  '<div class="form-actions"><gcds-button id="back-4" type="button" button-role="secondary">Back</gcds-button><gcds-button id="submit-4" type="button" button-role="primary">Submit</gcds-button></div>';
 document.getElementById('back-4').addEventListener('click',function(){showStep(3);});
 document.getElementById('submit-4').addEventListener('click',function(){alert('Prototype: your request would be submitted here.');});
 Array.prototype.forEach.call(s.querySelectorAll('[data-edit]'),function(a){
  a.addEventListener('click',function(e){e.preventDefault();showStep(+a.getAttribute('data-edit'));});
 });
}
function dmsStr(k){var d=gv('f-dms-'+k+'D'),m=gv('f-dms-'+k+'M'),sec=gv('f-dms-'+k+'S');return (d&&m&&sec)?esc(d)+'\u00b0 '+esc(m)+'\u2032 '+esc(sec)+'\u2033':'None';}
function card(title,rows,editLabel,editStep){
 var body=rows.map(function(r){
  return '<div class="md-summary-row"><div class="md-summary-row__label">'+esc(r[0])+'</div><div class="md-summary-row__value">'+r[1]+'</div></div>';
 }).join('');
 return '<section class="md-summary-section" aria-labelledby="sc-'+editStep+'">'+
  '<div class="md-summary-card">'+
   '<div class="md-summary-card__header"><gcds-heading tag="h3" margin-top="0" margin-bottom="0" id="sc-'+editStep+'">'+esc(title)+'</gcds-heading></div>'+
   '<div class="md-summary-body">'+body+'</div>'+
   '<div class="md-summary-actions"><a href="#" data-edit="'+editStep+'">'+IC.pen+'<span>'+esc(editLabel)+'</span></a></div>'+
  '</div></section>';
}

/* ============ ERROR SUMMARY + inline ============ */
function setFieldError(id,msg){var el=document.getElementById(id);if(el)el.setAttribute('error-message',msg);}
function clearFieldError(id){var el=document.getElementById(id);if(el)el.removeAttribute('error-message');}
function finish(errMountId,errs,nextStep){
 var mount=document.getElementById(errMountId); mount.innerHTML='';
 if(errs.length===0){ showStep(nextStep); return; }
 var box=document.createElement('div');
 box.className='error-summary'; box.setAttribute('role','alert'); box.setAttribute('tabindex','-1'); box.id='error-summary';
 var ol='';
 errs.forEach(function(er){ ol+='<li><a href="#" data-target="'+er.id+'">'+esc(er.msg)+'</a></li>'; });
 box.innerHTML='<h2>There was a problem</h2><ol>'+ol+'</ol>';
 mount.appendChild(box);
 Array.prototype.forEach.call(box.querySelectorAll('a[data-target]'),function(a){
  a.addEventListener('click',function(e){e.preventDefault();var t=document.getElementById(a.getAttribute('data-target'));if(t){var inner=t.shadowRoot&&t.shadowRoot.querySelector('input,textarea');if(inner){inner.focus();}else if(t.focus){t.focus();}}});
 });
 window.scrollTo(0,0);
 box.focus();
}

/* ============ MODAL ============ */
function openModal(runOnLeave){
 var mount=document.getElementById('modal-mount'); if(mount.firstChild) return;
 var last=document.activeElement;
 var overlay=elFrom('<div class="modal-overlay"></div>');
 var modal=elFrom('<div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"></div>');
 modal.innerHTML='<button type="button" class="modal__close" aria-label="Close">'+IC.x+'</button>'+
  '<h2 id="modal-title">Leave without saving?</h2>'+
  '<p>If you leave now, any information entered on this page will be lost. Your responses will only be saved once you have reached the next step.</p>'+
  '<p>Are you sure you want to leave without saving?</p>'+
  '<div class="modal__actions"><gcds-button id="m-leave" type="button" button-role="danger">Leave without saving</gcds-button><gcds-button id="m-stay" type="button" button-role="secondary">Stay on page</gcds-button></div>';
 overlay.appendChild(modal); mount.appendChild(overlay);
 function close(){mount.innerHTML='';document.removeEventListener('keydown',onKey);if(last&&last.focus)last.focus();}
 function leave(){ if(state.uploadTimer){clearTimeout(state.uploadTimer);state.uploadTimer=null;} state.uploading=false; renderUploader(); close(); if(typeof runOnLeave==='function') runOnLeave(); }
 modal.querySelector('#m-leave').addEventListener('click',leave);
 modal.querySelector('#m-stay').addEventListener('click',close);
 modal.querySelector('.modal__close').addEventListener('click',close);
 function onKey(e){
  if(e.key==='Escape'){close();return;}
  if(e.key==='Tab'){
   var f=modal.querySelectorAll('button, gcds-button'); if(!f.length)return;
   var first=f[0],lastf=f[f.length-1];
   if(e.shiftKey&&document.activeElement===first){e.preventDefault();lastf.focus();}
   else if(!e.shiftKey&&document.activeElement===lastf){e.preventDefault();first.focus();}
  }
 }
 document.addEventListener('keydown',onKey);
 var lb=modal.querySelector('#m-leave'); if(lb.focus) lb.focus();
}

/* ============ Signature fix: force colour-variant wordmark dark ============ */
function fixSignature(){
 var tries=0;
 var iv=setInterval(function(){
  tries++;
  var sigs=[];
  var h=document.querySelector('gcds-header'); if(h&&h.shadowRoot){var s1=h.shadowRoot.querySelector('gcds-signature'); if(s1)sigs.push(s1);}
  var f=document.querySelector('gcds-footer'); if(f&&f.shadowRoot){var s2=f.shadowRoot.querySelector('gcds-signature'); if(s2)sigs.push(s2);}
  var done=0;
  sigs.forEach(function(sig){ var sr=sig.shadowRoot; if(sr){ if(!sr.getElementById('sig-fix')){var st=document.createElement('style');st.id='sig-fix';st.textContent='svg path:not(:first-of-type){fill:#1c1c1c!important;}';sr.appendChild(st);} done++; } });
  if(done>=2 || tries>60) clearInterval(iv);
 },150);
}

/* ============ BOOT ============ */
buildStep1(); buildStep2(); buildStep3();
renderBreadcrumbs();
fixSignature();
</script>
